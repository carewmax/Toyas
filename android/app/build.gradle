plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toyas.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.toyas.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The website lives in <repo>/docs and is bundled into the app as-is.
            assets.srcDirs = ['src/main/assets', '../../docs']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
