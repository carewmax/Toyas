name: Build Toyas Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Toyas.apk

      - name: Keep a copy on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Toyas-apk
          path: Toyas.apk

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish the APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Toyas app (latest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **Toyas.apk** below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser or Files app the first time.
          files: Toyas.apk
